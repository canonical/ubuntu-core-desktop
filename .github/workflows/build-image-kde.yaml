name: build-image-kde
on:
  pull_request:
  push:
    branches:
      - desktop/26
  workflow_dispatch:
  # The daily build is dispatched from main by
  # .github/workflows/daily-image-dispatch.yaml. A `schedule:` here can
  # never fire: GitHub only evaluates schedules from the default branch,
  # which is main (and main has no copy of this file at all).

permissions:
  contents: write

jobs:
  image:
    # 26.04 on purpose: matches build-image.yaml (GNOME) - on the 24.04
    # runner `calculate_rootfs_size` died with an instant SIGABRT inside
    # the du-based sizing (todo/20261009-..., ubuntu-image 3.10.10, GH
    # run 38010415300).
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Download snap inputs (desktop-26-latest release assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snaps
          # Wait for the rolling snap releases to exist: snap builds take
          # up to ~40min, and a schedule/push trigger can race with one.
          # Every component, including the core26-desktop BASE, comes from
          # its repo's desktop-26-latest release; the base is the
          # desktop-variant build from canonical/core-base-desktop's
          # build-snap-variant workflow. KDE does not seed the provider
          # snaps (build.sh's kde_gadget_connections references none of
          # them); only the GNOME build does.
          for i in $(seq 1 15); do
            ok=1
            for repo in canonical/pc-amd64-gadget-desktop \
                        canonical/ubuntu-core-desktop-snapd \
                        chris-bainbridge/ubuntu-desktop-provision \
                        chris-bainbridge/kf6-core26 \
                        chris-bainbridge/plasma-core-desktop \
                        chris-bainbridge/plasma-desktop-session; do
              gh release view desktop-26-latest -R "$repo" >/dev/null 2>&1 || ok=0
            done
            gh release view desktop-26-latest -R canonical/core-base-desktop >/dev/null 2>&1 || ok=0
            [ "$ok" = 1 ] && break
            echo "snap releases not all present yet; waiting ($i/15)"
            sleep 120
          done
          [ "$ok" = 1 ] || { echo "timed out waiting for snap releases" >&2; exit 1; }
          for spec in \
            canonical/pc-amd64-gadget-desktop:pc-desktop.snap:pc-desktop.snap \
            canonical/ubuntu-core-desktop-snapd:snapd.snap:snapd.snap \
            chris-bainbridge/ubuntu-desktop-provision:ubuntu-desktop-init.snap:ubuntu-desktop-init.snap \
            chris-bainbridge/kf6-core26:kf6-core26.snap:kf6-core26.snap \
            chris-bainbridge/plasma-core-desktop:plasma-core-desktop.snap:plasma-core-desktop.snap \
            chris-bainbridge/plasma-desktop-session:plasma-desktop-session.snap:plasma-desktop-session.snap
          do
            repo=$(printf '%s' "$spec" | cut -d: -f1)
            asset=$(printf '%s' "$spec" | cut -d: -f2)
            local_name=$(printf '%s' "$spec" | cut -d: -f3)
            gh release download desktop-26-latest -R "$repo" -p "$asset" \
              -O "snaps/$local_name" --clobber
          done
          # Desktop-variant core26-desktop base, built by
          # canonical/core-base-desktop's build-snap-variant workflow on
          # desktop/26.
          gh release download desktop-26-latest -R canonical/core-base-desktop \
            -p core26-desktop.snap -O snaps/core26-desktop-variant.snap --clobber
          ls -la snaps/

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools dosfstools mtools fakeroot crudini zstd
          sudo snap install --classic ubuntu-image

      - name: Enable KVM and install QEMU for the boot gate
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          # Hosted runners expose /dev/kvm but only to the kvm group
          # (github.blog changelog 2024-04-02, "hardware accelerated
          # Android virtualization").
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Boot gate (asserts the Plasma session actually starts)
        # The published image has no credentials (first boot runs the
        # plasma-setup wizard), so it cannot be driven over SSH. Build a
        # second, throwaway image with a gate account, boot it headless and
        # require plasmashell to be running.
        #
        # This is the only check that catches cross-snap breakage: in
        # 2026-11 kf6-core26 started shipping Qt 6.12 while kwin in the
        # Plasma snaps was still built against 6.11, and the session
        # crash-looped while every version manifest and dependency check
        # stayed green.
        run: |
          set -euo pipefail

          ssh-keygen -q -t ed25519 -N '' -f gate_key

          # The runner's disk is small (14G) and snap seeding writes several
          # GB into the image; log free space so a slow/failed boot can be
          # correlated with it.
          df -h /

          ./build.sh \
            --desktop kde \
            --model-account-key ci/account-key.assert \
            --base-snap snaps/core26-desktop-variant.snap \
            --gadget-snap snaps/pc-desktop.snap \
            --snapd-snap snaps/snapd.snap \
            --snap snaps/plasma-core-desktop.snap \
            --snap snaps/kf6-core26.snap \
            --snap snaps/ubuntu-desktop-init.snap \
            --kde-session-snap snaps/plasma-desktop-session.snap \
            --kde-plasma-snap snaps/plasma-core-desktop.snap \
            --user gate --password gate --autologin \
            --ssh-authorized-keys gate_key.pub \
            --build-dir gate-build \
            --model ci/ubuntu-core-desktop-kde-26-amd64-dangerous.model

          # Hosted runners have no GPU: virtio-vga without virgl, with the
          # session compositor on llvmpipe. KVM when the runner exposes
          # it, TCG otherwise (much slower).
          accel=(-accel tcg -cpu max)
          if [ -w /dev/kvm ]; then
            accel=(-enable-kvm -cpu host)
          else
            echo "::warning::/dev/kvm not writable; booting under TCG"
          fi

          sshg() {
            ssh -p 2222 -i gate_key \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 -o BatchMode=yes gate@127.0.0.1 "$@"
          }

          qemu=""
          stop_qemu() {
            if [ -n "$qemu" ]; then
              kill "$qemu" 2>/dev/null || true
              wait "$qemu" 2>/dev/null || true
              qemu=""
            fi
          }
          trap stop_qemu EXIT

          # A hosted runner's disk is slow enough that the first boot of a
          # fresh image spends >12 min in snap seeding (the same image seeds
          # in ~90s locally), with GDM queued behind snapd.seeded. So split
          # the gate in two boots instead of waiting for a session that
          # cannot start yet:
          #   1. cold boot: wait for snapd.seeded to finish (the slow part);
          #   2. warm boot: assert the session appears promptly.
          # cache=unsafe is deliberate: the image is disposable and a
          # crashed boot only loses it, while ignoring flushes removes most
          # of the seeding cost on this storage.
          boot_vm() {
            rm -f gate-serial.log
            # -smp 4, not 2: snapd sizes apparmor_parser jobs as
            # ncpu-2 with a floor of -j1, so 2 vCPUs forces the
            # single-threaded path during snap seeding.
            qemu-system-x86_64 "${accel[@]}" -m 4096 -smp 4 \
              -bios /usr/share/ovmf/OVMF.fd \
              -drive file=gate-build/pc.img,if=virtio,format=raw,cache=unsafe \
              -device virtio-vga -display none \
              -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
              -device virtio-net-pci,netdev=net0 \
              -serial file:gate-serial.log &
            qemu=$!
            echo "==> waiting for the gate image to accept SSH"
            for _ in $(seq 1 60); do
              if sshg true 2>/dev/null; then return 0; fi
              sleep 10
            done
            echo "never accepted SSH; serial tail:" >&2
            tail -20 gate-serial.log >&2 || true
            return 1
          }

          echo "==> cold boot: waiting for snap seeding"
          boot_vm || exit 1
          seeded=0
          for i in $(seq 1 180); do
            if sshg 'systemctl is-active --quiet snapd.seeded'; then seeded=1; break; fi
            if [ $((i % 6)) -eq 0 ]; then
              echo "+$((i * 10))s: seeded=$(sshg 'systemctl is-active snapd.seeded' 2>/dev/null || echo unreachable)"
            fi
            sleep 10
          done
          if [ "$seeded" != 1 ]; then
            echo "::error::snap seeding did not finish within 30 minutes" >&2
            sshg 'echo "--- changes:"; snap changes 2>&1 | head -5;
                  echo "--- last tasks:"; snap tasks 1 2>&1 | sed -n "1,/^$/p" | tail -5;
                  echo "--- parser:"; ps -eo pid,etime,args 2>/dev/null | grep -m1 "[a]pparmor_parser" | cut -c1-140;
                  echo "--- seeded:"; systemctl is-active snapd.seeded' >&2 \
                || echo "(diagnostics ssh failed)" >&2
            exit 1
          fi
          echo "==> seeded; rebooting for the session check"
          stop_qemu
          sleep 5

          ok=0
          for attempt in 1 2; do
            echo "==> warm boot attempt ${attempt}"
            if ! boot_vm; then stop_qemu; continue; fi

            echo "==> waiting for the Plasma session"
            got=0
            for i in $(seq 1 48); do
              if sshg 'pgrep -x plasmashell' >/dev/null 2>&1; then got=1; break; fi
              if [ $((i % 6)) -eq 0 ]; then
                echo "+$((i * 10))s: $(sshg 'systemctl is-active snapd.seeded gdm graphical.target 2>/dev/null | tr "\n" " "; loginctl list-sessions --no-legend | wc -l' 2>/dev/null || echo unreachable)"
              fi
              sleep 10
            done
            if [ "$got" = 1 ]; then ok=1; break; fi

            # Dump while the VM is still alive.
            echo "--- jobs:" >&2; sshg 'systemctl list-jobs --no-pager' >&2 || true
            echo "--- sddm:" >&2; sshg 'systemctl status sddm --no-pager | tail -12' >&2 || true
            echo "--- sddm journal:" >&2; sshg 'sudo journalctl -b -u sddm --no-pager | tail -25' >&2 || true
            echo "::warning::attempt ${attempt} did not reach the session"
            stop_qemu
            sleep 5
          done
          sshg 'echo "--- sessions:"; loginctl list-sessions --no-legend; echo "--- procs:"; pgrep -a plasmashell || true' || true

          if [ "$ok" != 1 ]; then
            echo "::error::Plasma session did not start; failing before publish" >&2
            exit 1
          fi
          if ! sshg 'loginctl list-sessions --no-legend | grep -q "seat0"'; then
            echo "::error::no session on seat0 (autologin did not take)" >&2
            exit 1
          fi

          echo "==> boot gate passed: autologin session running plasmashell"
          stop_qemu
          rm -rf gate-build

      - name: Build image
        # No --user / --password / --autologin / --root-password /
        # --ssh-authorized-keys: the published image has no baked
        # credentials (nouser build, per the go-build wrapper
        # conventions) and never carries personal dev/ SSH keys. First
        # boot runs the plasma-setup first-boot account-creation wizard
        # (the KDE equivalent of GNOME's ubuntu-desktop-init; wired up by
        # build.sh on no-user KDE builds) to create the user account, so
        # no seed.iso is built or shipped. The model is pre-signed and
        # committed (see ci/), so no signing key is needed here beyond
        # the committed account-key assertion. See
        # todo/20261009-build-and-publish-kde-dangerous.txt.
        #
        # Thin-variant build: --base-snap is the desktop-variant
        # core26-desktop built from desktop/26 (build.sh bakes the
        # kf6 mesa/GL symlinks the chisel-cut variant lacks). No provider
        # snaps are seeded on KDE: build.sh's kde_gadget_connections
        # references none of them.
        run: |
          du --version | head -1
          ./build.sh \
            --desktop kde \
            --model-account-key ci/account-key.assert \
            --base-snap snaps/core26-desktop-variant.snap \
            --gadget-snap snaps/pc-desktop.snap \
            --snapd-snap snaps/snapd.snap \
            --snap snaps/plasma-core-desktop.snap \
            --snap snaps/kf6-core26.snap \
            --snap snaps/ubuntu-desktop-init.snap \
            --kde-session-snap snaps/plasma-desktop-session.snap \
            --kde-plasma-snap snaps/plasma-core-desktop.snap \
            --model ci/ubuntu-core-desktop-kde-26-amd64-dangerous.model

      - name: Compress
        id: compress
        run: |
          img=ubuntu-core-desktop-kde.img.zst
          zstd -T0 -19 build/pc.img -o "$img"

          # GitHub release/API assets are capped at 2GiB
          # (2147483648 bytes). KDE's image carries extra snaps
          # (kf6-core26/plasma-core-desktop/plasma-desktop-session) so
          # it can land just over that cap where GNOME's doesn't (GH
          # run 38333363452: 422 "size must be less than 2147483648").
          # Split into <2GiB parts when needed; reassemble with:
          #   cat ubuntu-core-desktop-kde.img.zst.part* > ubuntu-core-desktop-kde.img.zst
          assets=()
          size=$(stat -c%s "$img")
          limit=$((1950*1000*1000))
          if [ "$size" -ge "$limit" ]; then
            split -b 1900M -d -a2 "$img" "${img}.part"
            rm -f "$img"
            mapfile -t parts < <(ls "${img}".part??)
            assets=("${parts[@]}")
          else
            assets=("$img")
          fi

          sha256sum "${assets[@]}" > SHA256SUMS
          assets+=("SHA256SUMS")

          {
            echo "assets<<EOF"
            printf '%s\n' "${assets[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: image-kde
          path: ${{ steps.compress.outputs.assets }}
          compression-level: 0
          retention-days: 14

      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ steps.compress.outputs.assets }}
        run: |
          # Same rolling-release scheme as build-image.yaml (see the
          # comment on its amd64 publish step): stable asset names, no
          # dated tags, provenance in manifest.txt. --latest=false so the
          # repo's "Latest" badge stays on the amd64 GNOME image.
          tag=kde-latest
          day=$(date -u +%Y%m%d)

          {
            printf 'built: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'commit: %s\n' "$GITHUB_SHA"
            printf 'run: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'snaps:\n'
            for s in snaps/*.snap; do
              ver=$(unsquashfs -cat "$s" meta/snap.yaml 2>/dev/null \
                    | sed -n 's/^version: //p' | head -1)
              printf '  %s (%s)\n' "$(basename "$s")" "${ver:-unknown}"
            done
          } > manifest.txt

          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$GITHUB_REPOSITORY" --latest=false \
                 --title "Ubuntu Core Desktop 26 KDE (dangerous)" \
                 --notes "Rolling developer preview (KDE); replaced by every green build."
          gh release upload "$tag" $ASSETS manifest.txt \
            -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --latest=false \
            --title "Ubuntu Core Desktop 26 KDE (dangerous) - ${day}" \
            --notes "Rolling developer preview, replaced by every green build on desktop/26. Signed with an individual's registered test key; snaps are unasserted and can never be refreshed. No credentials are baked in: first boot runs the plasma-setup first-boot wizard (the KDE equivalent of GNOME's ubuntu-desktop-init) to create the user account. See manifest.txt for the source commit and the snap versions in this image. If the image was split into \`*.img.zst.partNN\` files (GitHub's 2GiB asset cap), reassemble first: \`cat ubuntu-core-desktop-kde.img.zst.part* > ubuntu-core-desktop-kde.img.zst\`, then verify against SHA256SUMS. Decompress with: \`zstd -T0 -d --sparse ubuntu-core-desktop-kde.img.zst -o pc.img\` (the --sparse flag is required or the output allocates the full ~20G). Boot with virt-install or qemu per README.md."

