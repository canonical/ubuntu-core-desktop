name: boot-gate-arm64

# One-shot arm64 boot gate (the final proof point of the arm64 image
# pipeline): boot the published gnome-arm64 release under same-arch qemu
# (TCG, no KVM on hosted arm64 runners) on ubuntu-26.04-arm and verify it
# reaches a working wizard/greeter.
#
# Deliberately workflow_dispatch-only, never per-push: a TCG boot is a
# 10-60 min burn, so this is a reusable one-shot gate dispatched when a
# new image release needs boot verification.
#
# Two tiers (selectable, default both, run in parallel as separate jobs):
#
#   MODE MODEL (verified 2026-11-09; record: mode-forensics.md in the
#   core26-swap workspace): UC26 images boot DIRECTLY INTO RUN MODE on
#   the first boot. The initramfs installer ("install-and-run-at-once")
#   creates ubuntu-boot/save/data, writes modeenv mode=run, and CONTINUES
#   THE SAME BOOT (initrd switch-root -- there is no install->run reboot
#   to wait for, ever; an earlier gate version waited for one and burned
#   its whole budget on healthy boots). snapd reads its mode from the
#   modeenv FILE (boot.SystemMode reads the file first; the kernel
#   cmdline label is only a fallback for a MISSING modeenv), so the
#   boot-1 /proc/cmdline label snapd_recovery_mode=install is STALE for
#   the entire first boot and must NEVER be used as mode evidence.
#
#   Tier A -- the PUBLISHED artifact: download the dated gnome-arm64
#   release asset, decompress, boot, and assert SMOKE milestones from
#   the SERIAL console log (console=ttyAMA0 is baked into the gadget's
#   cmdline.extra by build.sh, so the serial log is the diagnosis
#   channel). Required: kernel boot + seeding completion + single boot
#   (no reboot). The serial console cannot see graphical activity (the
#   quiet cmdline limits journald->console forwarding to err+, and
#   session scopes never print), so tier A stays smoke-level: absence of
#   graphical/gdm/wizard serial milestones is NOT a failure and must not
#   be misread as "the wizard is unreachable" (that exact misreading
#   cost a fix cycle on the first gate). Tier B is the real gate. The
#   image is a nouser build with no credentials, so tier A is
#   observational only: no SSH, no login.
#
#   Tier B -- a KEY-VARIANT image built in-job from the SAME snap set as
#   the image-arm64 job (same release assets, same model) but with a
#   CI-generated ephemeral keypair passed via build.sh
#   --ssh-authorized-keys. That flag bakes root's authorized_keys (and
#   PermitRootLogin yes) WITHOUT touching the wizard path: no --user is
#   given, so InitialSetupEnable stays true and first boot still runs
#   the ubuntu-desktop-init wizard via GDM initial-setup. Tier B boots
#   that image with user-mode networking (hostfwd) and asserts the
#   functional chain over SSH: modeenv=run (direct mode evidence), a
#   single boot (one journal boot entry -- no transition/reboot), system
#   running (degraded only for documented benign units), gdm active, the
#   wizard session on seat0 (gnome-initial-setup + ubuntu_init running),
#   the expected arm64 snap set, a store install (cowsay, then removed),
#   and snap refresh --list. The "Initialize device" request-serial
#   error/retry noise is EXPECTED on CI-built serial-less images and is
#   reported, never gated on (it blocks nothing mode-related).
#
# Fix cycles are for qemu args / firmware / assertions ONLY: if the
# image itself fails to boot, that is a finding to report, not to paper
# over.
#
# ubuntu-26.04-arm on purpose (not 24.04-arm): tier B rebuilds the image
# with ubuntu-image, which SIGABRTs inside calculate_rootfs_size on the
# 24.04 runners' du (the same reason the image job pins ubuntu-26.04 /
# ubuntu-26.04-arm; see build-image.yaml and actions/runner-images
# #14747). Tier A could run on either, but keeping both jobs on the same
# validated 26.04-arm label keeps the firmware/qemu versions identical.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: >-
          Which tier(s) to run: A = published image, serial milestones;
          B = key-variant build, SSH assertions; both = parallel.
        required: true
        default: both
        type: choice
        options:
          - A
          - B
          - both
      release_tag:
        description: >-
          Dated release tag whose img.zst tier A boots.
        required: true
        default: gnome-arm64-20261108
        type: string

permissions:
  contents: read

env:
  # Shared qemu machine shape for both tiers: -M virt with GICv3,
  # virtio disk/NIC/GPU/rng, no display, serial (the machine's PL011 ->
  # guest ttyAMA0) captured to a file. AAVMF (qemu-efi-aarch64) is the
  # UEFI firmware: the non-secboot build, since the gadget's shim/grub
  # EFI chain does not need secure boot and the amd64 flow likewise
  # boots plain OVMF. The package ships full 64 MiB flash images, so
  # they can be used directly as pflash (a writable copy of the VARS
  # image is required).
  #
  # -cpu cortex-a76, NOT -cpu max: under TCG, -cpu max hangs AAVMF
  # 2025.11 before BDS (serial shows only the SEC banner, then silence
  # forever; reproduced locally with a blank disk — cortex-a76 reaches
  # BDS and prints to serial, with or without the virtio-gpu GOP
  # present, so the whole boot stays visible on ttyAMA0). The virtio NIC
  # carries romfile= (empty): the runner has no PXE option-ROM package,
  # and the firmware boots from the virtio-blk disk with its built-in
  # driver, so the NIC option ROM is unnecessary — without it qemu
  # aborts at startup ("failed to find romfile efi-virtio.rom").
  #
  # Guest RAM is 8G (raised from 4G): the seeded desktop set includes
  # multi-GB snap unpacks (gnome-desktop-runtime), and a 4G guest under
  # TCG thrashed swap in the first gate legs (serial stall + SSH death
  # ~22 min in). The runner has 16G, so 8G is safe and cheap.
  QEMU_ARGS: >-
    -M virt,gic-version=3
    -cpu cortex-a76
    -accel tcg,thread=multi
    -smp 4
    -m 8192
  # Boot budget: 240 min (BOOT_BUDGET in seconds). Realistic for the
  # 4-vCPU TCG runner: earlier gate legs measured seeding still running
  # at the 60-min and 180-min marks (and TCG legs see SSH stalls/deaths
  # mid-boot), so 240 min covers the single-boot path (initramfs
  # install-and-run-at-once, snapd seed change, GDM wizard start) with
  # margin. A boot that is not up within this budget is a finding, not
  # something more budget fixes.
  BOOT_BUDGET: 14400

jobs:
  tier-a:
    name: Tier A - published image smoke gate (serial milestones)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 330
    if: inputs.tier == 'A' || inputs.tier == 'both'
    steps:
      - name: Install qemu + AAVMF firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-efi-aarch64 zstd
          qemu-system-aarch64 --version
          # Locate the firmware; tolerate both package layouts.
          code=""
          vars=""
          for f in /usr/share/AAVMF/AAVMF_CODE.fd \
                   /usr/share/qemu-efi-aarch64/AAVMF_CODE.fd; do
            [ -e "$f" ] && code="$f" && break
          done
          for f in /usr/share/AAVMF/AAVMF_VARS.fd \
                   /usr/share/qemu-efi-aarch64/AAVMF_VARS.fd; do
            [ -e "$f" ] && vars="$f" && break
          done
          [ -n "$code" ] && [ -n "$vars" ] || {
            echo "AAVMF firmware not found:" >&2
            dpkg -L qemu-efi-aarch64 >&2 || true
            exit 1
          }
          echo "AAVMF_CODE=$code" >> "$GITHUB_ENV"
          echo "AAVMF_VARS=$vars" >> "$GITHUB_ENV"

      - name: Download the published arm64 image release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # /mnt is root-owned on this runner (the image job's "Prepare
          # the /mnt build workspace" step handles the same thing).
          sudo mkdir -p /mnt/bootgate
          sudo chown "$USER": /mnt/bootgate
          cd /mnt/bootgate
          df -h /mnt
          gh release download "${{ inputs.release_tag }}" \
            -R "$GITHUB_REPOSITORY" \
            -p '*.img.zst' -p 'SHA256SUMS' --clobber
          sha256sum -c SHA256SUMS

      - name: Decompress (sparse; the image is a 20G sparse file)
        run: |
          cd /mnt/bootgate
          zstd -T0 -d --sparse *.img.zst -o pc.img
          ls -la pc.img
          df -h /mnt

      - name: Boot the published image and assert serial milestones
        # SMOKE tier -- serial milestones only (tier B is the real gate).
        #
        # On UC26 the initramfs installer writes modeenv mode=run mid-
        # boot-1 and the system continues the SAME boot into run mode,
        # so run mode is INFERRED here from the single boot completing
        # seeding (no reboot happened; a UC26 system that finished
        # seeding without rebooting is in run mode by construction). The
        # boot-1 cmdline label (snapd_recovery_mode=install) is stale
        # for the whole first boot and is deliberately NOT used as mode
        # evidence.
        #
        # Required milestones:
        #   kernel     - firmware/GRUB/kernel got going (boot happened)
        #   seed_done  - snapd.seeded finished (seeding completed)
        #   single boot- exactly ONE kernel boot (no reboot). UC26 never
        #                reboots install->run, so a second boot would be
        #                a FINDING (unexpected transition or crash).
        #
        # seed/snapd_daemon/graphical/gdm/wizard are REPORT-ONLY: the
        # serial console cannot see graphical activity (journald->console
        # forwarding is err+ under the quiet cmdline and no session
        # scopes print), so their absence here is NOT a failure and must
        # not be misread as "the wizard is unreachable" -- that misreading
        # of the first gate run cost a fix cycle. Tier B (SSH) is the
        # real gate.
        #
        # set -u only: GH runs steps with bash -e already, and this
        # script greps for many patterns that legitimately do not match
        # (report-only milestones); failure paths exit 1 explicitly.
        run: |
          set -u
          cd /mnt/bootgate
          cp "$AAVMF_VARS" VARS.fd
          rm -f serial.log qemu.log milestones.txt
          qemu-system-aarch64 $QEMU_ARGS \
            -drive if=pflash,format=raw,readonly=on,file="$AAVMF_CODE" \
            -drive if=pflash,format=raw,file=VARS.fd \
            -drive file=pc.img,if=none,format=raw,id=hd0 \
            -device virtio-blk-pci,drive=hd0 \
            -device virtio-gpu-pci,edid=on \
            -device virtio-rng-pci \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0,romfile= \
            -display none \
            -serial file:serial.log \
            > qemu.log 2>&1 &
          qpid=$!
          echo "qemu pid: $qpid"

          declare -A pat=(
            [kernel]='EFI stub|GRUB|Booting Linux|Linux version [0-9]'
            [seed]='Snap Seeder|snapd\.seeded|Installing the system'
            [seed_done]='Finished snapd\.seeded|Finished Snap Seeder|Seeding completed'
            [graphical]='Reached target Graphical Interface'
            [gdm]='GNOME Display Manager'
            [wizard]='gnome-initial-setup'
            [snapd_daemon]='Started snapd\.service|Started Snap Daemon'
          )
          required="kernel seed_done"

          deadline=$((SECONDS + BOOT_BUDGET))
          ok=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$qpid" 2>/dev/null; then
              echo "FINDING: qemu exited early at t=${SECONDS}s"
              tail -20 qemu.log || true
              tail -60 serial.log || true
              break
            fi
            line=""
            miss=""
            for k in kernel seed seed_done graphical gdm wizard snapd_daemon; do
              if grep -aqE "${pat[$k]}" serial.log 2>/dev/null; then
                line="$line $k=Y"
              else
                line="$line $k=-"
                case " $required " in
                  *" $k "*) miss="$miss $k" ;;
                esac
              fi
            done
            echo "t=${SECONDS}s:$line (serial bytes: $(stat -c%s serial.log 2>/dev/null || echo 0))"
            if [ -z "$miss" ]; then ok=1; break; fi
            sleep 30
          done

          if [ "$ok" = 1 ]; then
            echo "required milestones reached; dwelling 300s to catch a second boot or late failure"
            sleep 300
          fi

          # Boot count: GRUB prints "Loading Linux <version> ..." exactly
          # once per kernel boot and always reaches the serial console.
          # Kernel-side markers cannot be counted (EFI stub prints
          # several lines per boot; the kernel banner is quieted).
          bootcount="$(grep -ac 'Loading Linux' serial.log 2>/dev/null || true)"
          if [ "$bootcount" -eq 0 ]; then
            bootcount="$(grep -ac 'EFI stub: Booting Linux Kernel' serial.log 2>/dev/null || true)"
          fi

          {
            echo "verdict: $([ "$ok" = 1 ] && echo PASS || echo FAIL)"
            echo
            echo "serial size: $(stat -c%s serial.log 2>/dev/null || echo 0) bytes"
            echo "boot count (Loading Linux lines; one per kernel boot): $bootcount"
            echo "EFI stub lines (info only; several print per boot): $(grep -ac 'EFI stub' serial.log 2>/dev/null || echo 0)"
            echo
            echo "milestone matches:"
            for k in kernel seed seed_done graphical gdm wizard snapd_daemon; do
              echo "--- $k ($(grep -acE "${pat[$k]}" serial.log 2>/dev/null || echo 0) lines)"
              grep -aE "${pat[$k]}" serial.log 2>/dev/null | head -5
            done
            echo
            echo "all session/user-manager lines on serial (report-only):"
            grep -aE 'Session .* of user|User Manager for UID' serial.log 2>/dev/null | head -20
            echo
            echo "err-level console lines (journald forwards err+; report-only):"
            grep -acE 'Failed to start|apparmor="DENIED"' serial.log 2>/dev/null || true
            grep -aE 'Failed to start|apparmor="DENIED"' serial.log 2>/dev/null | head -20 || true
            echo
            echo "serial tail (last 80 lines):"
            tail -80 serial.log 2>/dev/null
          } > milestones.txt
          cat milestones.txt

          # Single-boot assertion: a second kernel boot on a UC26 image
          # would mean an unexpected install->run reboot or a crash
          # reboot -- a finding either way (the corrected model is ONE
          # boot; the initramfs installer continues the same boot).
          # A count of 0 means the boot marker was not printed (cannot
          # verify from serial) -- that is reported, not failed: the
          # kernel milestone already proved a boot happened.
          if [ "$ok" = 1 ] && [ "$bootcount" -eq 1 ]; then
            echo "PASS: single boot (no reboot), kernel up, seeding completed"
          elif [ "$ok" = 1 ] && [ "$bootcount" -eq 0 ]; then
            echo "WARN: boot-count marker not found on serial (boot count unverifiable); asserted via absence of a second boot marker"
          elif [ "$ok" = 1 ]; then
            echo "FAIL: bootcount=$bootcount (want exactly 1) -- unexpected second kernel boot"
            ok=0
          fi
          [ "$ok" = 1 ] || exit 1

      - name: Upload tier A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-gate-arm64-tier-a
          path: |
            /mnt/bootgate/serial.log
            /mnt/bootgate/qemu.log
            /mnt/bootgate/milestones.txt
          if-no-files-found: warn

  tier-b:
    name: Tier B - key-variant image, SSH functional gate
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 350
    if: inputs.tier == 'B' || inputs.tier == 'both'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build deps (image job set) + qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools dosfstools mtools \
            fakeroot crudini zstd qemu-system-arm qemu-efi-aarch64
          sudo snap install --classic ubuntu-image
          qemu-system-aarch64 --version
          code=""
          vars=""
          for f in /usr/share/AAVMF/AAVMF_CODE.fd \
                   /usr/share/qemu-efi-aarch64/AAVMF_CODE.fd; do
            [ -e "$f" ] && code="$f" && break
          done
          for f in /usr/share/AAVMF/AAVMF_VARS.fd \
                   /usr/share/qemu-efi-aarch64/AAVMF_VARS.fd; do
            [ -e "$f" ] && vars="$f" && break
          done
          [ -n "$code" ] && [ -n "$vars" ] || {
            echo "AAVMF firmware not found" >&2
            dpkg -L qemu-efi-aarch64 >&2 || true
            exit 1
          }
          echo "AAVMF_CODE=$code" >> "$GITHUB_ENV"
          echo "AAVMF_VARS=$vars" >> "$GITHUB_ENV"

      - name: Prepare the /mnt build workspace
        # Same reason as the image job: the ~14G root disk cannot hold
        # the 20G pc.img; /mnt can.
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/ucd-bootgate /mnt/tmp /mnt/bootgate
          sudo chown -R "$USER": /mnt/ucd-bootgate /mnt/tmp /mnt/bootgate

      - name: Download snap inputs (desktop-26-latest assets, arm64)
        # Verbatim snap set of the image-arm64 job: whatever it builds
        # today, this key-variant builds with --ssh-authorized-keys
        # added and nothing else changed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snaps
          for i in $(seq 1 25); do
            ok=1
            for spec in \
              canonical/pc-amd64-gadget-desktop:pc-desktop-arm64.snap \
              canonical/ubuntu-core-desktop-snapd:snapd-arm64.snap \
              canonical/ubuntu-desktop-session-snap:ubuntu-desktop-session-arm64.snap \
              canonical/gnome-desktop-runtime:gnome-desktop-runtime-arm64.snap \
              canonical/pipewire-snap:pipewire-arm64.snap \
              canonical/accountsservice-snap:accountsservice-arm64.snap \
              canonical/provd-snap:provd-arm64.snap \
              canonical/fprintd-snap:fprintd-arm64.snap \
              canonical/boltd-snap:bolt-arm64.snap \
              canonical/geoclue-snap:geoclue-arm64.snap \
              chris-bainbridge/ubuntu-desktop-provision:ubuntu-desktop-init-arm64.snap
            do
              repo=${spec%%:*}
              asset=${spec#*:}
              gh release view desktop-26-latest -R "$repo" --json assets \
                -q '.assets[].name' 2>/dev/null | grep -qx "$asset" || ok=0
            done
            gh release view desktop-26-thin-latest -R canonical/core-base-desktop \
              --json assets -q '.assets[].name' 2>/dev/null \
              | grep -qx core26-desktop-arm64.snap || ok=0
            [ "$ok" = 1 ] && break
            echo "snap assets not all present yet; waiting ($i/25)"
            sleep 120
          done
          [ "$ok" = 1 ] || { echo "timed out waiting for snap assets" >&2; exit 1; }
          for spec in \
            canonical/pc-amd64-gadget-desktop:pc-desktop-arm64.snap:pc-desktop.snap \
            canonical/ubuntu-core-desktop-snapd:snapd-arm64.snap:snapd.snap \
            canonical/ubuntu-desktop-session-snap:ubuntu-desktop-session-arm64.snap:ubuntu-desktop-session.snap \
            canonical/gnome-desktop-runtime:gnome-desktop-runtime-arm64.snap:gnome-desktop-runtime.snap \
            canonical/pipewire-snap:pipewire-arm64.snap:pipewire.snap \
            canonical/accountsservice-snap:accountsservice-arm64.snap:accountsservice.snap \
            canonical/provd-snap:provd-arm64.snap:provd.snap \
            canonical/fprintd-snap:fprintd-arm64.snap:fprintd.snap \
            canonical/boltd-snap:bolt-arm64.snap:bolt.snap \
            canonical/geoclue-snap:geoclue-arm64.snap:geoclue.snap \
            chris-bainbridge/ubuntu-desktop-provision:ubuntu-desktop-init-arm64.snap:ubuntu-desktop-init.snap
          do
            repo=$(printf '%s' "$spec" | cut -d: -f1)
            asset=$(printf '%s' "$spec" | cut -d: -f2)
            local_name=$(printf '%s' "$spec" | cut -d: -f3)
            gh release download desktop-26-latest -R "$repo" -p "$asset" \
              -O "snaps/$local_name" --clobber
          done
          gh release download desktop-26-thin-latest -R canonical/core-base-desktop \
            -p core26-desktop-arm64.snap -O snaps/core26-desktop-variant.snap --clobber
          ls -la snaps/

      - name: Generate the ephemeral CI keypair
        # Lives only on this runner; the PRIVATE key is never uploaded
        # as an artifact (only gate_key.pub is, for the record).
        run: |
          ssh-keygen -t ed25519 -N '' -C boot-gate-arm64-ci \
            -f /mnt/bootgate/gate_key
          ssh-keygen -y -f /mnt/bootgate/gate_key

      - name: Build the key-variant image
        # Image-arm64 job's exact invocation plus --ssh-authorized-keys
        # (bakes root's authorized_keys + PermitRootLogin yes; the
        # wizard path is untouched since no --user is passed).
        run: |
          TMPDIR=/mnt/tmp ./build.sh \
            --desktop gnome \
            --arch arm64 \
            --model-account-key ci/account-key.assert \
            --ssh-authorized-keys /mnt/bootgate/gate_key.pub \
            --base-snap snaps/core26-desktop-variant.snap \
            --gadget-snap snaps/pc-desktop.snap \
            --snapd-snap snaps/snapd.snap \
            --snap snaps/accountsservice.snap \
            --snap snaps/provd.snap \
            --snap snaps/fprintd.snap \
            --snap snaps/bolt.snap \
            --snap snaps/geoclue.snap \
            --snap snaps/ubuntu-desktop-session.snap \
            --snap snaps/gnome-desktop-runtime.snap \
            --snap snaps/pipewire.snap \
            --snap snaps/ubuntu-desktop-init.snap \
            --model ci/ubuntu-core-desktop-26-arm64-amd64-dangerous.model \
            --build-dir /mnt/ucd-bootgate
          ls -la /mnt/ucd-bootgate/pc.img

      - name: Boot the key-variant image and run SSH assertions
        # THE REAL GATE. UC26 boots DIRECTLY into run mode on the first
        # boot: the initramfs installer creates ubuntu-boot/save/data,
        # writes modeenv mode=run, and CONTINUES THE SAME BOOT (initrd
        # switch-root -- no reboot). snapd's mode comes from the modeenv
        # FILE, so /proc/cmdline's boot-1 label
        # snapd_recovery_mode=install is stale for the entire first boot
        # and is NOT used as mode evidence (an earlier gate version
        # waited for a cmdline without it -- an install->run reboot that
        # UC26 images never perform -- and burned its budget waiting on
        # a healthy boot).
        #
        # Mode evidence asserted here: /var/lib/snapd/modeenv says
        # mode=run over SSH (direct), plus a completed snapd seed change
        # ("Initialize system state") on a SINGLE boot (journalctl
        # --list-boots == 1; no reboot is expected and a second boot is
        # a finding).
        #
        # "Initialize device" (become-operational) request-serial errors
        # and its ~5-10 min retry cadence are EXPECTED on CI-built
        # images (no brand key -> no seeded device serial): reported,
        # never gated on -- the serial failure blocks nothing
        # mode-related, only auto-refresh scheduling (manual store ops
        # always work).
        run: |
          set -u
          cd /mnt/bootgate
          cp "$AAVMF_VARS" VARS.fd
          rm -f serial.log qemu.log ssh-transcript.txt assertions.txt
          qemu-system-aarch64 $QEMU_ARGS \
            -drive if=pflash,format=raw,readonly=on,file="$AAVMF_CODE" \
            -drive if=pflash,format=raw,file=VARS.fd \
            -drive file=/mnt/ucd-bootgate/pc.img,if=none,format=raw,id=hd0 \
            -device virtio-blk-pci,drive=hd0 \
            -device virtio-gpu-pci,edid=on \
            -device virtio-rng-pci \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0,romfile= \
            -display none \
            -serial file:serial.log \
            > qemu.log 2>&1 &
          qpid=$!
          echo "qemu pid: $qpid"

          SSH=(ssh -i gate_key -p 2222 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=known_hosts \
            -o ConnectTimeout=30 -o BatchMode=yes -o LogLevel=ERROR \
            root@127.0.0.1)
          # rsh with transport-failure retry: TCG can stall sshd long
          # enough to drop an attempt (SSH died ~22 min in during the
          # first gate legs). Only ssh's own exit code 255 (transport
          # failure) retries; the remote command's exit status is
          # preserved for the assertions below.
          rsh() {
            local out rc=0 i
            echo "\$ $*" >> ssh-transcript.txt
            for i in 1 2 3; do
              out="$("${SSH[@]}" "$@" 2>&1)"; rc=$?
              printf '%s\n' "$out" >> ssh-transcript.txt
              [ "$rc" -ne 255 ] && break
              sleep 20
            done
            printf '%s\n' "$out"
            return "$rc"
          }

          deadline=$((SECONDS + BOOT_BUDGET))
          up=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$qpid" 2>/dev/null; then
              echo "FINDING: qemu exited early at t=${SECONDS}s"
              tail -20 qemu.log || true
              tail -60 serial.log || true
              exit 1
            fi
            if "${SSH[@]}" true 2>/dev/null; then
              up=1
              echo "SSH reachable at t=${SECONDS}s"
              break
            fi
            echo "t=${SECONDS}s: ssh not up yet; serial: $(tail -c 300 serial.log 2>/dev/null | tr '\r' '\n' | tail -1)"
            sleep 30
          done
          [ "$up" = 1 ] || {
            echo "FINDING: sshd never came up within ${BOOT_BUDGET}s of boot"
            tail -100 serial.log || true
            exit 1
          }

          # Wait for the seeded RUN-MODE system on THIS boot (single-boot
          # model: no reboot involved, so sshd never goes away -- if it
          # does, that is a finding the loop will ride out and the
          # deadline will catch). Evidence: modeenv says mode=run, snapd's
          # seed change is Done, and the seeded kernel snap is installed.
          # (The install-phase system also runs sshd and accepts the
          # baked key, so "SSH up" alone proves nothing.)
          seeded=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$qpid" 2>/dev/null; then
              echo "FINDING: qemu exited early at t=${SECONDS}s"
              tail -20 qemu.log || true
              tail -60 serial.log || true
              exit 1
            fi
            modeenv="$(rsh 'grep -E "^mode=" /var/lib/snapd/modeenv 2>/dev/null' | tail -1 || true)"
            seedline="$(rsh 'snap changes 2>/dev/null | grep "Initialize system state"' | tail -1 || true)"
            seedstate="$(printf '%s' "$seedline" | awk 'NF {print $2}')"
            nkernel="$(rsh 'snap list 2>/dev/null | grep -c "^pc-kernel " || true' | tail -1 || true)"
            nall="$(rsh 'snap list 2>/dev/null | grep -c "" || true' | tail -1 || true)"
            if [ "$modeenv" = "mode=run" ] && [ "$seedstate" = "Done" ] && [ "$nkernel" -ge 1 ] 2>/dev/null; then
              seeded=1
              echo "seeded run-mode system reached at t=${SECONDS}s (modeenv=run, seed Done, snap list: $nall snaps)"
              break
            fi
            echo "t=${SECONDS}s: waiting for seeded run-mode system (modeenv='$modeenv' seed='$seedstate' pc-kernel=$nkernel snaps=$nall)"
            sleep 60
          done
          [ "$seeded" = 1 ] || {
            echo "FINDING: no seeded run-mode system within ${BOOT_BUDGET}s of boot"
            # Best-effort in-guest diagnosis (this command set shows the
            # seed/device state that serial-only observation could not).
            rsh 'snap changes' || true
            rsh 'journalctl -u snapd --no-pager | tail -60' || true
            rsh 'cat /var/lib/snapd/modeenv' || true
            rsh 'snap list' || true
            tail -100 serial.log || true
            exit 1
          }

          # Wait for the wizard (gnome-initial-setup session) -- GDM runs
          # initial setup when no user accounts exist. The account may be
          # named gnome-initial-setup or gnome-initial-setup-<n> (GDM
          # creates a transient account), so the grep is a prefix match.
          wizard=0; greeter=0; sessid=""
          wdeadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$wdeadline" ]; do
            sess="$(rsh 'loginctl list-sessions --no-legend 2>/dev/null' || true)"
            echo "--- sessions at t=${SECONDS}s:"; echo "$sess"
            if echo "$sess" | grep -q 'gnome-initial-setup'; then
              wizard=1
              sessid="$(printf '%s\n' "$sess" | grep 'gnome-initial-setup' | awk 'NF {print $1}' | head -1)"
              break
            fi
            if echo "$sess" | grep -q 'gdm-greeter'; then greeter=1; fi
            sleep 30
          done

          # Evidence capture (always collected).
          rsh 'cat /proc/cmdline' || true
          rsh 'cat /var/lib/snapd/modeenv' || true
          rsh 'journalctl --list-boots --no-pager' || true
          rsh 'snap changes' || true
          rsh 'snap list' || true
          rsh 'systemctl is-system-running' || true
          rsh 'systemctl --failed --no-pager' || true
          rsh 'systemctl is-active gdm' || true
          rsh 'loginctl list-sessions --no-legend' || true
          rsh 'pgrep -ax provd' || true
          rsh 'pgrep -af "[u]buntu_init" || true; pgrep -af "[g]nome-initial-setup" || true' || true
          rsh 'test -d /snap/core26-desktop && ls /snap/core26-desktop/ && mount | grep core26-desktop | head -3' || true
          rsh 'test -S /run/gnome-initial-setup/desktop-provision/init.socket && echo init.socket-present || echo init.socket-missing' || true
          rsh 'journalctl -b --no-pager | tail -40' || true

          # ---- Gate verdict (tier B is the real gate) ----
          failed=0
          check() { # name value expected
            if [ "$2" = "$3" ]; then echo "PASS: $1=$2"; else echo "FAIL: $1=$2 (want $3)"; failed=1; fi
          }

          # 1. system running -- degraded accepted ONLY for documented
          #    benign units (snapd.snap-repair.service: network fetch of
          #    repair assertions fails on restricted CI networking).
          isrunning="$(rsh 'systemctl is-system-running' | head -1 || true)"
          case "$isrunning" in
            running) echo "PASS: is-system-running=running" ;;
            degraded)
              echo "WARN: is-system-running=degraded; failed units:"
              funits="$(rsh 'systemctl list-units --failed --no-legend || true')"
              funits="$(printf '%s\n' "$funits" | awk 'NF && $1 != "UNIT" {print $1}' || true)"
              echo "$funits"
              badunits="$(printf '%s\n' "$funits" | grep -vE '^snapd\.snap-repair\.service$' || true)"
              if [ -z "$badunits" ]; then
                echo "PASS: is-system-running=degraded with only the documented benign unit (snapd.snap-repair.service)"
              else
                echo "FAIL: degraded with undocumented failed units: $badunits"
                failed=1
              fi
              ;;
            *) echo "FAIL: is-system-running=$isrunning"; failed=1 ;;
          esac

          # 2. gdm active
          gdma="$(rsh 'systemctl is-active gdm' | head -1 || true)"
          check "gdm-active" "$gdma" active

          # 3. wizard session on seat0: gnome-initial-setup session
          #    (loginctl session name == the transient wizard user) plus
          #    ubuntu_init actually running. ubuntu_init is execed by
          #    launch-desktop-provision-init only AFTER provd's
          #    init.socket appears, so allow a few minutes of lag after
          #    the session shows up. pgrep -f + [c]haracter-class: a bare
          #    remote `pgrep -f ubuntu_init` matches its own sh -c
          #    command line (false positive).
          uinit=0; gisetup=0; seat=""
          if [ "$wizard" = 1 ] && [ -n "$sessid" ]; then
            udeadline=$((SECONDS + 300))
            while [ "$SECONDS" -lt "$udeadline" ]; do
              gisetup="$(rsh 'pgrep -fc "[g]nome-initial-setup"' | head -1 || true)"
              uinit="$(rsh 'pgrep -fc "[u]buntu_init"' | head -1 || true)"
              [ "$uinit" -ge 1 ] 2>/dev/null && break
              sleep 15
            done
            seat="$(rsh "loginctl show-session $sessid -p Seat" | head -1 || true)"
            case "$seat" in
              Seat=seat0) echo "PASS: wizard session on seat0 (id=$sessid)" ;;
              *) echo "FAIL: wizard session not on seat0 ($seat)"; failed=1 ;;
            esac
            check "gnome-initial-setup running" "$( [ "$gisetup" -ge 1 ] 2>/dev/null && echo 1 || echo 0 )" 1
            check "ubuntu_init running" "$( [ "$uinit" -ge 1 ] 2>/dev/null && echo 1 || echo 0 )" 1
          elif [ "$greeter" = 1 ]; then
            echo "FAIL: greeter-only session on seat0; gnome-initial-setup wizard session never appeared"
            failed=1
          else
            echo "FAIL: no wizard/greeter session appeared on seat0 within 1800s"
            failed=1
          fi

          # 4. expected arm64 snap set
          snaps="$(rsh 'snap list' || true)"
          for s in pc-desktop core26-desktop pc-kernel snapd \
                   ubuntu-desktop-session gnome-desktop-runtime \
                   ubuntu-desktop-init pipewire; do
            if echo "$snaps" | grep -qE "^$s +[0-9]"; then
              echo "PASS: snap $s present"
            else
              echo "FAIL: snap $s missing"; failed=1
            fi
          done

          # 5. variant base mounted
          bases="$(rsh 'test -d /snap/core26-desktop && echo yes || echo no' | head -1 || true)"
          check "variant-base-mounted" "$bases" yes

          # 6. modeenv = run (direct mode evidence; NOT the stale boot-1
          #    cmdline label, which is expected to still read install)
          modeenv="$(rsh 'cat /var/lib/snapd/modeenv' || true)"
          echo "$modeenv" | head -5
          if echo "$modeenv" | grep -qE '^mode=run($|[[:space:]])'; then
            echo "PASS: modeenv mode=run"
          else
            echo "FAIL: modeenv does not say mode=run"
            failed=1
          fi
          cmdline="$(rsh 'tr "\0" "\n" < /proc/cmdline | grep snapd_recovery_mode || true' | head -1 || true)"
          echo "REPORT: boot-1 cmdline label (stale by design, NOT mode evidence): $cmdline"

          # 7. single boot: one entry in the journal (UC26 does NOT
          #    reboot install->run; two entries would be a finding)
          boots="$(rsh 'journalctl --list-boots --no-legend | wc -l' | head -1 || true)"
          check "single-boot (journalctl --list-boots entries)" "$boots" 1

          # 8. store install path: install a small public snap, then
          #    remove it. Manual store ops are not gated by the
          #    device-serial failure (only auto-refresh scheduling is).
          if rsh 'timeout 900 snap install cowsay'; then
            echo "PASS: store install cowsay"
            rsh 'snap list cowsay' || true
            rsh 'timeout 120 snap run cowsay Moo' || true
            if rsh 'timeout 300 snap remove cowsay'; then
              echo "PASS: store remove cowsay"
            else
              echo "FAIL: snap remove cowsay"; failed=1
            fi
          else
            echo "FAIL: snap install cowsay"; failed=1
            rsh 'snap changes' || true
          fi

          # 9. snap refresh --list works
          if rsh 'timeout 300 snap refresh --list'; then
            echo "PASS: snap refresh --list (exit 0)"
          else
            echo "FAIL: snap refresh --list"; failed=1
          fi

          # Expected CI noise, REPORT-ONLY: the dangerous model's
          # request-serial fails on the store (no brand key -> no seeded
          # serial on CI builds) and become-operational retries.
          changes_out="$(rsh 'snap changes' || true)"
          initdev_total="$(printf '%s\n' "$changes_out" | grep -c 'Initialize device' || true)"
          initdev_err="$(printf '%s\n' "$changes_out" | grep 'Initialize device' | grep -c 'Error' || true)"
          serial_errs="$(rsh 'journalctl -u snapd --no-pager | grep -c "device serial" || true' | tail -1 || true)"
          echo "REPORT: Initialize-device changes=$initdev_total (errors=$initdev_err), snapd journal device-serial lines=$serial_errs -- EXPECTED retry noise on CI serial-less images; not gated on"

          {
            echo "modeenv:"; echo "$modeenv"
            echo
            echo "cmdline label (stale, report-only): $cmdline"
            echo "journal boot entries: $boots"
            echo "wizard session id: $sessid  seat: $seat  gnome-initial-setup procs: $gisetup  ubuntu_init procs: $uinit"
            echo
            echo "snap list:"; echo "$snaps"
            echo
            echo "Initialize device changes: $initdev_total (errors: $initdev_err) -- expected CI retry noise, not gated on"
          } > assertions.txt

          [ "$failed" = 0 ] || exit 1
          echo "TIER B VERDICT: PASS"

      - name: Upload tier B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-gate-arm64-tier-b
          path: |
            /mnt/bootgate/serial.log
            /mnt/bootgate/qemu.log
            /mnt/bootgate/ssh-transcript.txt
            /mnt/bootgate/assertions.txt
            /mnt/bootgate/gate_key.pub
          if-no-files-found: warn
