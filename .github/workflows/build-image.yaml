name: build-image
on:
  pull_request:
  push:
    branches:
      - desktop/26
  workflow_dispatch:
  # The daily build is dispatched from main by
  # .github/workflows/daily-image-dispatch.yaml. A `schedule:` here can
  # never fire: GitHub only evaluates schedules from the default branch,
  # which is main (and main's copy of this file has no schedule).

permissions:
  contents: write

jobs:
  image:
    # 26.04 on purpose: every locally-proven build of this image runs on
    # resolute; on the 24.04 runner `calculate_rootfs_size` died with an
    # instant SIGABRT inside the du-based sizing (todo/20261009-...,
    # ubuntu-image 3.10.10, GH run 38010415300).
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Download snap inputs (desktop-26-latest release assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snaps
          # Wait for the rolling snap releases to exist: snap builds take
          # up to ~40min, and a schedule/push trigger can race with one.
          # Every component, including the core26-desktop BASE, comes from
          # its repo's desktop-26-latest release; the base is the
          # desktop-variant build from canonical/core-base-desktop's
          # build-snap-variant workflow, and the five provider snaps come
          # from their own repos.
          for i in $(seq 1 15); do
            ok=1
            for repo in canonical/pc-amd64-gadget-desktop \
                        canonical/ubuntu-core-desktop-snapd \
                        canonical/ubuntu-desktop-session-snap \
                        canonical/gnome-desktop-runtime \
                        canonical/pipewire-snap \
                        canonical/accountsservice-snap \
                        canonical/provd-snap \
                        canonical/fprintd-snap \
                        canonical/boltd-snap \
                        canonical/geoclue-snap \
                        canonical/ubuntu-desktop-a11y \
                        chris-bainbridge/ubuntu-desktop-provision; do
              gh release view desktop-26-latest -R "$repo" >/dev/null 2>&1 || ok=0
            done
            gh release view desktop-26-latest -R canonical/core-base-desktop >/dev/null 2>&1 || ok=0
            [ "$ok" = 1 ] && break
            echo "snap releases not all present yet; waiting ($i/15)"
            sleep 120
          done
          [ "$ok" = 1 ] || { echo "timed out waiting for snap releases" >&2; exit 1; }
          for spec in \
            canonical/pc-amd64-gadget-desktop:pc-desktop.snap:pc-desktop.snap \
            canonical/ubuntu-core-desktop-snapd:snapd.snap:snapd.snap \
            canonical/ubuntu-desktop-session-snap:ubuntu-desktop-session.snap:ubuntu-desktop-session.snap \
            canonical/gnome-desktop-runtime:gnome-desktop-runtime.snap:gnome-desktop-runtime.snap \
            canonical/pipewire-snap:pipewire.snap:pipewire.snap \
            canonical/accountsservice-snap:accountsservice.snap:accountsservice.snap \
            canonical/provd-snap:provd.snap:provd.snap \
            canonical/fprintd-snap:fprintd.snap:fprintd.snap \
            canonical/boltd-snap:bolt.snap:bolt.snap \
            canonical/geoclue-snap:geoclue.snap:geoclue.snap \
            canonical/ubuntu-desktop-a11y:ubuntu-desktop-a11y.snap:ubuntu-desktop-a11y.snap \
            chris-bainbridge/ubuntu-desktop-provision:ubuntu-desktop-init.snap:ubuntu-desktop-init.snap
          do
            repo=$(printf '%s' "$spec" | cut -d: -f1)
            asset=$(printf '%s' "$spec" | cut -d: -f2)
            local_name=$(printf '%s' "$spec" | cut -d: -f3)
            gh release download desktop-26-latest -R "$repo" -p "$asset" \
              -O "snaps/$local_name" --clobber
          done
          # Desktop-variant core26-desktop base, built by
          # canonical/core-base-desktop's build-snap-variant workflow on
          # desktop/26. The variant carries the desktop rootfs/GNOME
          # integration while AccountsService/provd/fprintd/bolt/geoclue
          # live in the provider snaps above (udisks2/upower stay store
          # snaps from the model).
          gh release download desktop-26-latest -R canonical/core-base-desktop \
            -p core26-desktop.snap -O snaps/core26-desktop-variant.snap --clobber
          ls -la snaps/

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools dosfstools mtools fakeroot crudini zstd
          sudo snap install --classic ubuntu-image

      - name: Build image
        # No --user / --autologin / --root-password / --ssh-authorized-keys:
        # the published image has no baked credentials (nouser build, per
        # the go-build wrapper conventions) and never carries personal
        # dev/ SSH keys; first boot runs the ubuntu-desktop-init wizard
        # via GDM initial-setup.  The model is pre-signed and committed
        # (see ci/), so no signing key is needed here beyond the
        # committed account-key assertion.  See
        # todo/20261009-build-and-publish-gnome-dangerous.txt.
        #
        # Thin-variant build: --base-snap is the desktop-variant
        # core26-desktop (built from desktop/26 by core-base-desktop's
        # build-snap-variant workflow), and the five
        # provider snaps (accountsservice/provd/fprintd/bolt/geoclue) are
        # seeded explicitly so build.sh's baked gadget.yaml connections
        # to their slots resolve at seed time. udisks2/upower remain
        # store snaps pulled in via the model.
        run: |
          du --version | head -1
          ./build.sh \
            --desktop gnome \
            --model-account-key ci/account-key.assert \
            --base-snap snaps/core26-desktop-variant.snap \
            --gadget-snap snaps/pc-desktop.snap \
            --snapd-snap snaps/snapd.snap \
            --snap snaps/accountsservice.snap \
            --snap snaps/provd.snap \
            --snap snaps/fprintd.snap \
            --snap snaps/bolt.snap \
            --snap snaps/geoclue.snap \
            --snap snaps/ubuntu-desktop-a11y.snap \
            --snap snaps/ubuntu-desktop-session.snap \
            --snap snaps/gnome-desktop-runtime.snap \
            --snap snaps/pipewire.snap \
            --snap snaps/ubuntu-desktop-init.snap \
            --model ci/ubuntu-core-desktop-26-amd64-dangerous.model

      - name: Enable KVM and install QEMU for the boot gate
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          # Hosted runners expose /dev/kvm but only to the kvm group
          # (github.blog changelog 2024-04-02, "hardware accelerated
          # Android virtualization").
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Boot gate (asserts the GNOME session actually starts)
        # The published image has no credentials (first boot runs the
        # ubuntu-desktop-init wizard), so it cannot be driven over SSH.
        # Build a second, throwaway image with a gate account, boot it
        # headless and require gnome-shell to be running.
        #
        # Nothing else catches cross-snap breakage: the 2026-11 KDE
        # incident (Qt 6.12 runtime against a kwin built for 6.11) passed
        # every version manifest and dependency check and only showed up
        # as a crash-looping session at boot.
        run: |
          set -euo pipefail

          ssh-keygen -q -t ed25519 -N '' -f gate_key

          ./build.sh \
            --desktop gnome \
            --model-account-key ci/account-key.assert \
            --base-snap snaps/core26-desktop-variant.snap \
            --gadget-snap snaps/pc-desktop.snap \
            --snapd-snap snaps/snapd.snap \
            --snap snaps/accountsservice.snap \
            --snap snaps/provd.snap \
            --snap snaps/fprintd.snap \
            --snap snaps/bolt.snap \
            --snap snaps/geoclue.snap \
            --snap snaps/ubuntu-desktop-a11y.snap \
            --snap snaps/ubuntu-desktop-session.snap \
            --snap snaps/gnome-desktop-runtime.snap \
            --snap snaps/pipewire.snap \
            --snap snaps/ubuntu-desktop-init.snap \
            --user gate --password gate --autologin \
            --ssh-authorized-keys gate_key.pub \
            --build-dir gate-build \
            --model ci/ubuntu-core-desktop-26-amd64-dangerous.model

          # Hosted runners have no GPU: virtio-vga without virgl, with the
          # session compositor on llvmpipe. KVM when the runner exposes
          # it, TCG otherwise (much slower).
          accel=(-accel tcg -cpu max)
          if [ -w /dev/kvm ]; then
            accel=(-enable-kvm -cpu host)
          else
            echo "::warning::/dev/kvm not writable; booting under TCG"
          fi

          qemu-system-x86_64 "${accel[@]}" -m 4096 -smp 2 \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive file=gate-build/pc.img,if=virtio,format=raw \
            -device virtio-vga -display none \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -serial file:gate-serial.log &
          qemu=$!
          trap 'kill "$qemu" 2>/dev/null || true' EXIT

          sshg() {
            ssh -p 2222 -i gate_key \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 -o BatchMode=yes gate@127.0.0.1 "$@"
          }

          echo "==> waiting for the gate image to accept SSH"
          up=0
          for _ in $(seq 1 90); do
            if sshg true 2>/dev/null; then up=1; break; fi
            sleep 10
          done
          if [ "$up" != 1 ]; then
            echo "::error::gate image never accepted SSH; serial tail:" >&2
            tail -40 gate-serial.log >&2 || true
            exit 1
          fi

          echo "==> waiting for the GNOME session"
          ok=0
          for i in $(seq 1 90); do
            if sshg 'pgrep -x gnome-shell' >/dev/null 2>&1; then ok=1; break; fi
            # Log where it is stuck, so a failure is diagnosable from the
            # job log alone (the compositor can be slow to appear while
            # snapd is still seeding).
            if [ $((i % 6)) -eq 0 ]; then
              echo "+$((i * 10))s: $(sshg 'systemctl is-active gdm graphical.target | tr "\n" " "; loginctl list-sessions --no-legend | wc -l' 2>/dev/null || echo unreachable)"
            fi
            sleep 10
          done

          sshg 'echo "--- sessions:"; loginctl list-sessions --no-legend; echo "--- shell:"; pgrep -a gnome-shell || true' || true

          if [ "$ok" != 1 ]; then
            echo "::error::GNOME session did not start; failing before publish" >&2
            sshg 'echo "--- jobs:"; systemctl list-jobs --no-pager;
                  echo "--- gdm:"; systemctl status gdm --no-pager | tail -15;
                  echo "--- gdm-homedirs:"; systemctl status gdm-homedirs --no-pager | tail -15;
                  echo "--- gdm-homedirs journal:"; sudo journalctl -b -u gdm-homedirs --no-pager | tail -20;
                  echo "--- seeded:"; systemctl is-active snapd.seeded;
                  echo "--- graphical:"; systemctl status graphical.target --no-pager | tail -8' >&2 || true
            exit 1
          fi
          if ! sshg 'loginctl list-sessions --no-legend | grep -q "seat0"'; then
            echo "::error::no session on seat0 (autologin did not take)" >&2
            exit 1
          fi

          echo "==> boot gate passed: autologin session running gnome-shell"
          rm -rf gate-build

      - name: Compress
        run: |
          zstd -T0 -19 build/pc.img -o ubuntu-core-desktop-gnome.img.zst
          sha256sum ubuntu-core-desktop-gnome.img.zst > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: image
          path: |
            ubuntu-core-desktop-gnome.img.zst
            SHA256SUMS
          compression-level: 0
          retention-days: 14

      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One rolling release per flavour, with stable asset names and no
          # dated tags. The image is a developer preview that nobody
          # bisects (they bisect the source), so a dated asset only ever
          # goes stale: in 2026-11 a developer installed a 12-day-old
          # gnome-YYYYMMDD release and silently missed a week of fixes.
          # Provenance lands in manifest.txt instead of in an archive of
          # old images.
          #
          # The tag itself is never deleted: a failed build leaves the
          # previous image published, and --clobber swaps the asset in
          # place (a few minutes where the asset is absent mid-upload;
          # SHA256SUMS is there to catch a partial download).
          tag=gnome-latest
          img=ubuntu-core-desktop-gnome.img.zst
          day=$(date -u +%Y%m%d)

          # What actually went into this image: the source commit and the
          # version of every seeded snap (the provider/session snaps stamp
          # their git revision into the version, so this is the record
          # worth keeping).
          {
            printf 'image: %s\n' "$img"
            printf 'built: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'commit: %s\n' "$GITHUB_SHA"
            printf 'run: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'snaps:\n'
            for s in snaps/*.snap; do
              ver=$(unsquashfs -cat "$s" meta/snap.yaml 2>/dev/null \
                    | sed -n 's/^version: //p' | head -1)
              printf '  %s (%s)\n' "$(basename "$s")" "${ver:-unknown}"
            done
          } > manifest.txt

          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$GITHUB_REPOSITORY" --latest \
                 --title "Ubuntu Core Desktop 26 GNOME (dangerous)" \
                 --notes "Rolling developer preview; replaced by every green build."
          gh release upload "$tag" "$img" SHA256SUMS manifest.txt \
            -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --latest \
            --title "Ubuntu Core Desktop 26 GNOME (dangerous) - ${day}" \
            --notes "Rolling developer preview, replaced by every green build on desktop/26. Signed with an individual's registered test key; snaps are unasserted and can never be refreshed; no credentials are baked in (first boot runs the ubuntu-desktop-init wizard). See manifest.txt for the source commit and the snap versions in this image. Decompress with: \`zstd -T0 -d --sparse ubuntu-core-desktop-gnome.img.zst -o pc.img\` (the --sparse flag is required or the output allocates the full ~20G). Boot with virt-install or qemu per README.md."

  image-arm64:
    # The arm64 counterpart of the `image` job: same flow, arm64 runner,
    # the -arm64 snap assets, the arm64 model, --arch arm64. The KDE
    # branch has no arm64 counterpart (the KDE snap set has no arm64
    # builds), so this job is GNOME-only.
    #
    # 26.04-arm on purpose, for the same reason the amd64 job pins
    # ubuntu-26.04: the 24.04 runner's du SIGABRTs inside ubuntu-image's
    # calculate_rootfs_size (see the comment there). 26.04 and 26.04-arm
    # hosted runners are both GA (actions/runner-images #14747).
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Prepare the /mnt build workspace
        # The runner's ~14G root disk cannot hold the 20G pc.img; the
        # ephemeral /mnt volume can. build.sh accepts an absolute
        # --build-dir for exactly this.
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/ucd-arm64-build /mnt/tmp
          sudo chown -R "$USER": /mnt/ucd-arm64-build /mnt/tmp

      - name: Download snap inputs (desktop-26-latest release assets, arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snaps
          # Wait for the rolling snap releases to have their arm64 ASSETS:
          # snap builds take up to ~40min and a push can race one, and a
          # release that exists without the asset would make the downloads
          # below fail (notably the ubuntu-desktop-init Flutter build).
          # Same repos as the amd64 job (same asset set, -arm64 suffixes).
          for i in $(seq 1 25); do
            ok=1
            for spec in \
              canonical/pc-amd64-gadget-desktop:pc-desktop-arm64.snap \
              canonical/ubuntu-core-desktop-snapd:snapd-arm64.snap \
              canonical/ubuntu-desktop-session-snap:ubuntu-desktop-session-arm64.snap \
              canonical/gnome-desktop-runtime:gnome-desktop-runtime-arm64.snap \
              canonical/pipewire-snap:pipewire-arm64.snap \
              canonical/accountsservice-snap:accountsservice-arm64.snap \
              canonical/provd-snap:provd-arm64.snap \
              canonical/fprintd-snap:fprintd-arm64.snap \
              canonical/boltd-snap:bolt-arm64.snap \
              canonical/geoclue-snap:geoclue-arm64.snap \
              canonical/ubuntu-desktop-a11y:ubuntu-desktop-a11y-arm64.snap \
              chris-bainbridge/ubuntu-desktop-provision:ubuntu-desktop-init-arm64.snap
            do
              repo=${spec%%:*}
              asset=${spec#*:}
              gh release view desktop-26-latest -R "$repo" --json assets \
                -q '.assets[].name' 2>/dev/null | grep -qx "$asset" || ok=0
            done
            gh release view desktop-26-latest -R canonical/core-base-desktop \
              --json assets -q '.assets[].name' 2>/dev/null \
              | grep -qx core26-desktop-arm64.snap || ok=0
            [ "$ok" = 1 ] && break
            echo "snap assets not all present yet; waiting ($i/25)"
            sleep 120
          done
          [ "$ok" = 1 ] || { echo "timed out waiting for snap assets" >&2; exit 1; }
          # The arm64 assets carry -arm64 suffixes on the same
          # desktop-26-latest release; they are
          # saved under the arch-neutral local names so the build.sh
          # invocation below matches the amd64 job line for line.
          #
          # Principle: every snap the amd64 flow sideloads locally is
          # sideloaded here too, from ITS arm64 build. Our local snaps are
          # never resolved from the store, whose arm64 revisions are stale
          # (ubuntu-desktop-init r134 is the old core22-based snap: the
          # model would then demand gnome-42-2204 alongside it). Store
          # snaps (pc-kernel, mesa-2404, udisks2, upower, ...) stay store
          # snaps, resolved via the model's arm64 revisions.
          for spec in \
            canonical/pc-amd64-gadget-desktop:pc-desktop-arm64.snap:pc-desktop.snap \
            canonical/ubuntu-core-desktop-snapd:snapd-arm64.snap:snapd.snap \
            canonical/ubuntu-desktop-session-snap:ubuntu-desktop-session-arm64.snap:ubuntu-desktop-session.snap \
            canonical/gnome-desktop-runtime:gnome-desktop-runtime-arm64.snap:gnome-desktop-runtime.snap \
            canonical/pipewire-snap:pipewire-arm64.snap:pipewire.snap \
            canonical/accountsservice-snap:accountsservice-arm64.snap:accountsservice.snap \
            canonical/provd-snap:provd-arm64.snap:provd.snap \
            canonical/fprintd-snap:fprintd-arm64.snap:fprintd.snap \
            canonical/boltd-snap:bolt-arm64.snap:bolt.snap \
            canonical/geoclue-snap:geoclue-arm64.snap:geoclue.snap \
            canonical/ubuntu-desktop-a11y:ubuntu-desktop-a11y-arm64.snap:ubuntu-desktop-a11y.snap \
            chris-bainbridge/ubuntu-desktop-provision:ubuntu-desktop-init-arm64.snap:ubuntu-desktop-init.snap
          do
            repo=$(printf '%s' "$spec" | cut -d: -f1)
            asset=$(printf '%s' "$spec" | cut -d: -f2)
            local_name=$(printf '%s' "$spec" | cut -d: -f3)
            gh release download desktop-26-latest -R "$repo" -p "$asset" \
              -O "snaps/$local_name" --clobber
          done
          # Desktop-variant core26-desktop base, arm64 leg, built by
          # canonical/core-base-desktop's build-snap-variant workflow on
          # desktop/26.
          gh release download desktop-26-latest -R canonical/core-base-desktop \
            -p core26-desktop-arm64.snap -O snaps/core26-desktop-variant.snap --clobber
          ls -la snaps/

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools dosfstools mtools fakeroot crudini zstd
          sudo snap install --classic ubuntu-image

      - name: Build image
        # Same stanza as the amd64 job (including the sideloaded
        # ubuntu-desktop-init, now from its arm64 asset), plus --arch
        # arm64, the arm64 model, and the /mnt build dir. No baked
        # credentials (nouser build); first boot runs the
        # ubuntu-desktop-init wizard via GDM initial-setup. pc-kernel and
        # the other asserted snaps resolve from the store's arm64
        # revisions via the model.
        run: |
          du --version | head -1
          TMPDIR=/mnt/tmp ./build.sh \
            --desktop gnome \
            --arch arm64 \
            --model-account-key ci/account-key.assert \
            --base-snap snaps/core26-desktop-variant.snap \
            --gadget-snap snaps/pc-desktop.snap \
            --snapd-snap snaps/snapd.snap \
            --snap snaps/accountsservice.snap \
            --snap snaps/provd.snap \
            --snap snaps/fprintd.snap \
            --snap snaps/bolt.snap \
            --snap snaps/geoclue.snap \
            --snap snaps/ubuntu-desktop-a11y.snap \
            --snap snaps/ubuntu-desktop-session.snap \
            --snap snaps/gnome-desktop-runtime.snap \
            --snap snaps/pipewire.snap \
            --snap snaps/ubuntu-desktop-init.snap \
            --model ci/ubuntu-core-desktop-26-arm64-amd64-dangerous.model \
            --build-dir /mnt/ucd-arm64-build

      - name: Compress
        run: |
          zstd -T0 -19 /mnt/ucd-arm64-build/pc.img \
            -o ubuntu-core-desktop-gnome-arm64.img.zst
          sha256sum ubuntu-core-desktop-gnome-arm64.img.zst > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: image-arm64
          path: |
            ubuntu-core-desktop-gnome-arm64.img.zst
            SHA256SUMS
          compression-level: 0
          retention-days: 14

      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same rolling-release scheme as the amd64 job (see the comment
          # there). --latest=false so the repo's "Latest" badge stays on
          # the amd64 GNOME image rather than moving to whichever flavour
          # published last.
          tag=gnome-arm64-latest
          img=ubuntu-core-desktop-gnome-arm64.img.zst
          day=$(date -u +%Y%m%d)

          {
            printf 'image: %s\n' "$img"
            printf 'built: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'commit: %s\n' "$GITHUB_SHA"
            printf 'run: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'snaps:\n'
            for s in snaps/*.snap; do
              ver=$(unsquashfs -cat "$s" meta/snap.yaml 2>/dev/null \
                    | sed -n 's/^version: //p' | head -1)
              printf '  %s (%s)\n' "$(basename "$s")" "${ver:-unknown}"
            done
          } > manifest.txt

          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$GITHUB_REPOSITORY" --latest=false \
                 --title "Ubuntu Core Desktop 26 GNOME arm64 (dangerous)" \
                 --notes "Rolling developer preview (arm64); replaced by every green build."
          gh release upload "$tag" "$img" SHA256SUMS manifest.txt \
            -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --latest=false \
            --title "Ubuntu Core Desktop 26 GNOME arm64 (dangerous) - ${day}" \
            --notes "Rolling developer preview (arm64), replaced by every green build on desktop/26. Signed with an individual's registered test key; snaps are unasserted and can never be refreshed; no credentials are baked in (first boot runs the ubuntu-desktop-init wizard). See manifest.txt for the source commit and the snap versions in this image. Decompress with: \`zstd -T0 -d --sparse ubuntu-core-desktop-gnome-arm64.img.zst -o pc.img\` (the --sparse flag is required or the output allocates the full ~20G). UEFI boot (shim/grub arm64); QEMU virt or an arm64 host per README.md."
