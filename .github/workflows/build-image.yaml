name: build-image
on:
  pull_request:
  push:
    branches:
      - desktop/26
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  image:
    # 26.04 on purpose: every locally-proven build of this image runs on
    # resolute; on the 24.04 runner `calculate_rootfs_size` died with an
    # instant SIGABRT inside the du-based sizing (todo/20261009-...,
    # ubuntu-image 3.10.10, GH run 38010415300).
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download snap inputs (desktop-26-latest release assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snaps
          # Wait for the rolling snap releases to exist: snap builds take
          # up to ~40min, and a schedule/push trigger can race with one.
          # The core26-desktop BASE comes from the desktop-26-thin-latest
          # release (the desktop-variant build on desktop/26-thin), NOT
          # the fat desktop-26-latest one; the five provider snaps come
          # from their own repos' desktop-26-latest releases.
          for i in $(seq 1 15); do
            ok=1
            for repo in canonical/pc-amd64-gadget-desktop \
                        canonical/ubuntu-core-desktop-snapd \
                        canonical/ubuntu-desktop-session-snap \
                        canonical/gnome-desktop-runtime \
                        canonical/pipewire-snap \
                        canonical/accountsservice-snap \
                        canonical/provd-snap \
                        canonical/fprintd-snap \
                        canonical/boltd-snap \
                        canonical/geoclue-snap \
                        chris-bainbridge/ubuntu-desktop-provision; do
              gh release view desktop-26-latest -R "$repo" >/dev/null 2>&1 || ok=0
            done
            gh release view desktop-26-thin-latest -R canonical/core-base-desktop >/dev/null 2>&1 || ok=0
            [ "$ok" = 1 ] && break
            echo "snap releases not all present yet; waiting ($i/15)"
            sleep 120
          done
          [ "$ok" = 1 ] || { echo "timed out waiting for snap releases" >&2; exit 1; }
          for spec in \
            canonical/pc-amd64-gadget-desktop:pc-desktop.snap:pc-desktop.snap \
            canonical/ubuntu-core-desktop-snapd:snapd.snap:snapd.snap \
            canonical/ubuntu-desktop-session-snap:ubuntu-desktop-session.snap:ubuntu-desktop-session.snap \
            canonical/gnome-desktop-runtime:gnome-desktop-runtime.snap:gnome-desktop-runtime.snap \
            canonical/pipewire-snap:pipewire.snap:pipewire.snap \
            canonical/accountsservice-snap:accountsservice.snap:accountsservice.snap \
            canonical/provd-snap:provd.snap:provd.snap \
            canonical/fprintd-snap:fprintd.snap:fprintd.snap \
            canonical/boltd-snap:bolt.snap:bolt.snap \
            canonical/geoclue-snap:geoclue.snap:geoclue.snap \
            chris-bainbridge/ubuntu-desktop-provision:ubuntu-desktop-init.snap:ubuntu-desktop-init.snap
          do
            repo=$(printf '%s' "$spec" | cut -d: -f1)
            asset=$(printf '%s' "$spec" | cut -d: -f2)
            local_name=$(printf '%s' "$spec" | cut -d: -f3)
            gh release download desktop-26-latest -R "$repo" -p "$asset" \
              -O "snaps/$local_name" --clobber
          done
          # Thin (desktop-variant) core26-desktop base, built by
          # canonical/core-base-desktop's build-snap-variant workflow on
          # desktop/26-thin. The variant carries the desktop rootfs/GNOME
          # integration while AccountsService/provd/fprintd/bolt/geoclue
          # live in the provider snaps above (udisks2/upower stay store
          # snaps from the model).
          gh release download desktop-26-thin-latest -R canonical/core-base-desktop \
            -p core26-desktop.snap -O snaps/core26-desktop-variant.snap --clobber
          ls -la snaps/

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools dosfstools mtools fakeroot crudini zstd
          sudo snap install --classic ubuntu-image

      - name: Build image
        # No --user / --autologin / --root-password / --ssh-authorized-keys:
        # the published image has no baked credentials (nouser build, per
        # the go-build wrapper conventions) and never carries personal
        # dev/ SSH keys; first boot runs the ubuntu-desktop-init wizard
        # via GDM initial-setup.  The model is pre-signed and committed
        # (see ci/), so no signing key is needed here beyond the
        # committed account-key assertion.  See
        # todo/20261009-build-and-publish-gnome-dangerous.txt.
        #
        # Thin-variant build: --base-snap is the desktop-variant
        # core26-desktop (built from desktop/26-thin), and the five
        # provider snaps (accountsservice/provd/fprintd/bolt/geoclue) are
        # seeded explicitly so build.sh's baked gadget.yaml connections
        # to their slots resolve at seed time. udisks2/upower remain
        # store snaps pulled in via the model.
        run: |
          du --version | head -1
          ./build.sh \
            --desktop gnome \
            --model-account-key ci/account-key.assert \
            --base-snap snaps/core26-desktop-variant.snap \
            --gadget-snap snaps/pc-desktop.snap \
            --snapd-snap snaps/snapd.snap \
            --snap snaps/accountsservice.snap \
            --snap snaps/provd.snap \
            --snap snaps/fprintd.snap \
            --snap snaps/bolt.snap \
            --snap snaps/geoclue.snap \
            --snap snaps/ubuntu-desktop-session.snap \
            --snap snaps/gnome-desktop-runtime.snap \
            --snap snaps/pipewire.snap \
            --snap snaps/ubuntu-desktop-init.snap \
            --model ci/ubuntu-core-desktop-26-amd64-dangerous.model

      - name: Compress
        run: |
          zstd -T0 -19 build/pc.img \
            -o "ubuntu-core-desktop-gnome-$(date -u +%Y%m%d).img.zst"
          sha256sum ubuntu-core-desktop-gnome-*.img.zst > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            ubuntu-core-desktop-gnome-*.img.zst
            SHA256SUMS
          compression-level: 0
          retention-days: 14

      - name: Publish dated release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date -u +%Y%m%d)
          tag="gnome-${day}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Same-day rebuild: replace that date's release entirely so the
            # tag always points at the newest run of the day.
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            --title "Ubuntu Core Desktop 26 GNOME (dangerous) - ${day}" \
            --notes "DANGEROUS developer preview. Signed with an individual's registered test key; snaps are unasserted and can never be refreshed; no credentials are baked in (first boot runs the ubuntu-desktop-init wizard). Decompress with: \`zstd -T0 -d --sparse ubuntu-core-desktop-gnome-${day}.img.zst -o pc.img\` (the --sparse flag is required or the output allocates the full ~20G). Boot with virt-install or qemu per README.md." \
            "ubuntu-core-desktop-gnome-${day}.img.zst" SHA256SUMS

      - name: Expire old dated image releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub has no default expiry for release assets (only workflow
          # artifacts get retention-days), and each daily run publishes a
          # dated ~2-4GiB image release, so they accumulate forever without
          # this. Delete dated image releases (and their tags) older than 14
          # days; match only gnome-YYYYMMDD/kde-YYYYMMDD tags so rolling or
          # manually-cut releases are never touched.
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # Skip today's tags: the other job may be mid-publish on one of
          # them right now, and an in-flight (unpublished) release shows
          # publishedAt=null, which jq's string comparison treats as older
          # than any cutoff -- deleting it would break the other job's
          # asset upload.
          day=$(date -u +%Y%m%d)
          gh release list -R "$GITHUB_REPOSITORY" --limit 250 --json tagName,publishedAt \
            | jq -r --arg cutoff "$cutoff" --arg day "$day" \
                '.[] | select(.tagName | test("^(gnome|kde)-[0-9]{8}$"))
                     | select(.tagName != "gnome-\($day)" and .tagName != "kde-\($day)")
                     | select(.publishedAt != null and .publishedAt < $cutoff)
                     | .tagName' \
            | while read -r old_tag; do
                echo "deleting expired image release: ${old_tag}"
                gh release delete "$old_tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
