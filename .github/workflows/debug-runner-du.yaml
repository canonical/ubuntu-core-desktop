name: debug-runner-du
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Environment facts
        run: |
          uname -a
          systemd --version | head -1
          cat /etc/os-release | head -3
          du --version | head -1
          which -a du
          echo "PATH=$PATH"
          echo "TMPDIR=${TMPDIR:-unset}"
          ls -ld /var/tmp /tmp
          mount | grep -E ' on /(var/)?tmp '
          df -h /var/tmp /tmp | sed -n '1,3p'
          systemctl --version | head -1
          snap version 2>/dev/null | head -6

      - name: Download snap inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snaps
          for spec in \
            canonical/pc-amd64-gadget-desktop:pc-desktop.snap:pc-desktop.snap \
            canonical/core-base-desktop:core26-desktop-cloudinit.snap:core26-desktop.snap \
            canonical/ubuntu-core-desktop-snapd:snapd.snap:snapd.snap \
            chris-bainbridge/ubuntu-desktop-provision:ubuntu-desktop-init.snap:ubuntu-desktop-init.snap \
            chris-bainbridge/kf6-core26:kf6-core26.snap:kf6-core26.snap \
            chris-bainbridge/plasma-core-desktop:plasma-core-desktop.snap:plasma-core-desktop.snap \
            chris-bainbridge/plasma-desktop-session:plasma-desktop-session.snap:plasma-desktop-session.snap
          do
            repo=$(printf '%s' "$spec" | cut -d: -f1)
            asset=$(printf '%s' "$spec" | cut -d: -f2)
            local_name=$(printf '%s' "$spec" | cut -d: -f3)
            gh release download desktop-26-latest -R "$repo" -p "$asset" \
              -O "snaps/$local_name" --clobber
          done
          ls -la snaps/

      - name: Build image under strace
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools dosfstools mtools fakeroot crudini zstd cloud-image-utils strace
          sudo snap install --classic ubuntu-image
          mkdir -p /tmp/traces
          set +e
          strace -ff -o /tmp/traces/t.log -e trace=execve,openat,openat2,newfstatat,statx,stat \
            ./build.sh \
            --desktop kde \
            --autologin \
            --user guest \
            --password "guest" \
            --model-account-key ci/account-key.assert \
            --base-snap snaps/core26-desktop.snap \
            --gadget-snap snaps/pc-desktop.snap \
            --snapd-snap snaps/snapd.snap \
            --snap snaps/plasma-core-desktop.snap \
            --snap snaps/kf6-core26.snap \
            --snap snaps/ubuntu-desktop-init.snap \
            --kde-session-snap snaps/plasma-desktop-session.snap \
            --kde-plasma-snap snaps/plasma-core-desktop.snap \
            --model ci/ubuntu-core-desktop-kde-26-amd64-dangerous.model
          rc=$?
          echo "build.sh rc=$rc"

      - name: Direct ubuntu-image with persistent workdir
        if: always()
        run: |
          ls -la build/ || true
          set +e
          mkdir -p /tmp/ui-out
          ubuntu-image snap -v --assertion ci/account-key.assert --validation=ignore \
            --output-dir /tmp/ui-out --image-size 20G --work-dir /tmp/ui-work \
            --snap build/custom-core.snap \
            --snap build/gadget.snap \
            --snap snaps/snapd.snap \
            --snap snaps/plasma-desktop-session.snap \
            --snap snaps/plasma-core-desktop.snap \
            --snap snaps/kf6-core26.snap \
            --snap snaps/ubuntu-desktop-init.snap \
            ci/ubuntu-core-desktop-kde-26-amd64-dangerous.model
          echo "direct ui rc=$?"
          echo "=== workdir tree (top):"
          find /tmp/ui-work -maxdepth 5 2>/dev/null | head -60
          echo "=== du -s -B1 on root:"
          du -s -B1 /tmp/ui-work/root; echo "du rc=$?"
          echo "=== du errors verbose:"
          du -s -B1 /tmp/ui-work/root 2>&1 | head -20; true
          echo "=== permissions of root tree:"
          ls -la /tmp/ui-work/root/var/lib/snapd/seed 2>/dev/null
          ls -la /tmp/ui-work/root/var/lib/snapd/seed/snaps 2>/dev/null | head

      - name: Analyze du trace
        if: always()
        run: |
          echo "=== du execve calls:"
          grep -l 'du "' /tmp/traces/t.log.* 2>/dev/null | head
          grep -h -m1 'execve.*"/.*du"' /tmp/traces/t.log.* 2>/dev/null | head -5
          echo "=== trace files for du processes:"
          for f in $(grep -l 'execve.*"/.*du"' /tmp/traces/t.log.* 2>/dev/null); do
            echo "--- $f:"
            cat "$f"
          done
          echo "=== last 60 lines of ubuntu-image trace:"
          ui=$(grep -l 'execve.*ubuntu-image' /tmp/traces/t.log.* 2>/dev/null | head -1)
          [ -n "$ui" ] && tail -60 "$ui"
          echo "=== leftover ubuntu-image workdirs:"
          ls -la /var/tmp/ | head -20